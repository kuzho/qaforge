<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background rounded squircle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121824"/>
      <stop offset="50%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>

    <!-- Outer border glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3a7bd5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Forge Hammer Head gradient -->
    <linearGradient id="hammerHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#d9e2ec"/>
      <stop offset="100%" stop-color="#9fb3c8"/>
    </linearGradient>

    <!-- Handle & Accent gradient (Cyberpunk Forge Cyan / Electric Blue) -->
    <linearGradient id="electricGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Energy spark orange / gold -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff3d00"/>
    </linearGradient>

    <!-- Success checkmark neon green -->
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#60efff"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" filter="url(#softShadow)"/>

  <!-- Subtle Anvil / Pedestal Base -->
  <path d="M 140 400 L 372 400 L 348 360 L 164 360 Z" fill="#1b2432" opacity="0.9"/>
  <path d="M 170 360 L 342 360 L 328 340 L 184 340 Z" fill="#243042" opacity="0.8"/>

  <!-- Circuit / Signal connection lines (representing API / Testing integration) -->
  <path d="M 80 256 L 160 256 L 200 300" stroke="#00f2fe" stroke-width="3" stroke-dasharray="6,6" fill="none" opacity="0.4"/>
  <circle cx="80" cy="256" r="6" fill="#00f2fe" opacity="0.6"/>

  <path d="M 432 256 L 352 256 L 312 300" stroke="#00ff87" stroke-width="3" stroke-dasharray="6,6" fill="none" opacity="0.4"/>
  <circle cx="432" cy="256" r="6" fill="#00ff87" opacity="0.6"/>

  <!-- Modern QA / Forge Hammer forming a stylized "Q" -->
  <!-- Hammer Handle (diagonal) -->
  <g transform="rotate(-38 256 256)" filter="url(#softShadow)">
    <!-- Handle -->
    <rect x="242" y="160" width="28" height="210" rx="14" fill="url(#electricGlow)"/>
    <rect x="247" y="240" width="18" height="120" rx="9" fill="#0a192f" opacity="0.4"/>
    <!-- Handle grip rings -->
    <line x1="242" y1="280" x2="270" y2="280" stroke="#0a192f" stroke-width="3"/>
    <line x1="242" y1="300" x2="270" y2="300" stroke="#0a192f" stroke-width="3"/>
    <line x1="242" y1="320" x2="270" y2="320" stroke="#0a192f" stroke-width="3"/>

    <!-- Hammer Head (Cybernetic Steel Block) -->
    <rect x="180" y="100" width="152" height="76" rx="16" fill="url(#hammerHead)"/>
    <!-- Hammer Face Chamfer Left -->
    <polygon points="180,100 160,114 160,162 180,176" fill="#b0c4de"/>
    <!-- Hammer Peen Right (Beveled) -->
    <polygon points="332,100 356,118 356,158 332,176" fill="#7b91a8"/>
    <!-- Core Power Cell inside hammer -->
    <rect x="232" y="124" width="48" height="28" rx="6" fill="url(#electricGlow)" filter="url(#glow)"/>
  </g>

  <!-- Big Glowing Neon QA Assertion Shield / Check Badge Overlay -->
  <g filter="url(#glow)">
    <!-- Shield / Badge background -->
    <circle cx="340" cy="330" r="64" fill="#0c192c" stroke="url(#neonGreen)" stroke-width="6"/>
    <!-- Verified Checkmark with sharp modern geometry -->
    <path d="M 308 330 L 330 354 L 376 304" fill="none" stroke="url(#neonGreen)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Forge Energy Impact Sparks -->
  <circle cx="210" cy="180" r="5" fill="url(#sparkGrad)" filter="url(#glow)"/>
  <circle cx="160" cy="140" r="4" fill="url(#sparkGrad)"/>
  <circle cx="360" cy="130" r="6" fill="url(#electricGlow)" filter="url(#glow)"/>
  <circle cx="390" cy="170" r="3" fill="url(#electricGlow)"/>
</svg>
